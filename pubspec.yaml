name: debt_splitter
description: >-
  Aplikasi mobile "Debt-Splitter" (Splitwise Offline-First): pencatat utang
  patungan yang berjalan 100% lokal tanpa backend server maupun login auth,
  lengkap dengan mekanisme peer-to-peer sync via QR Code.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # ================= Local Storage / DB Engine =================
  sqflite: ^2.4.3            # SQLite embedded (Android/iOS/macOS)
  path: ^1.9.1               # Manipulasi path DB
  path_provider: ^2.1.6      # Lokasi direktori data aplikasi

  # ================= P2P Sync Library =================
  # gzip/zlib (dart:io) & base64 (dart:convert) — bawaan SDK, tanpa dep eksternal
  qr_flutter: ^4.1.0         # Generator QR Code
  mobile_scanner: ^7.4.0     # Scanner QR/Barcode (on-device ML, offline)

  # ================= Utility =================
  collection: ^1.19.1         # PriorityQueue (heap) untuk settle-up engine
  uuid: ^4.6.0               # UUID v4 untuk Primary Key (id: STRING)
  provider: ^6.1.5+1         # State management / DI ringan (ChangeNotifier)
  share_plus: 10.1.4        # Native OS Share Sheet (deep link ke WhatsApp/chat)
  file_picker: 10.3.10
  pdf: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1 # Menjalankan unit-test DB di host/desktop

flutter:
  uses-material-design: true